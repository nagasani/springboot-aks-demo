name: CI - Test and SonarQube
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests-and-quality:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORG: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build, test and generate JaCoCo coverage
        run: mvn -B -ntp clean verify
      - name: SonarQube Cloud analysis and quality gate (once configured)
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ORG != '' && env.SONAR_PROJECT_KEY != '' }}
        run: >-
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization="$SONAR_ORG"
          -Dsonar.projectKey="$SONAR_PROJECT_KEY"
          -Dsonar.qualitygate.wait=true
      - name: Explain missing optional SonarQube configuration
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_ORG == '' || env.SONAR_PROJECT_KEY == '' }}
        run: echo 'Tests ran, but SonarQube Cloud is NOT configured; see README.md.'
