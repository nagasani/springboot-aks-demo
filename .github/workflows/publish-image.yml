name: Publish Docker image to ACR (optional OIDC automation)
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: azure-lab
    steps:
      - uses: actions/checkout@v4
      - name: Login to Azure via GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push SHA-tagged image
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ACR_NAME:?Set the ACR_NAME GitHub repository variable}"
          LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          az acr login --name "$ACR_NAME"
          docker build -t "$LOGIN_SERVER/springboot-aks-demo:${GITHUB_SHA}" .
          docker push "$LOGIN_SERVER/springboot-aks-demo:${GITHUB_SHA}"
          echo "Published: $LOGIN_SERVER/springboot-aks-demo:${GITHUB_SHA}"
